<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"(409|422)","swap":true},{"code":"[45]..","swap":false,"error":true}]}'>
  <title>{% block title %}garmin-hub{% endblock %} · garmin-hub</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <header class="topbar">
    <a class="brand" href="/">garmin-hub</a>
    {% if user %}
    <nav>
      <a href="/cuenta">Mi cuenta</a>
      {% if user.role == "user" %}
      <a href="/cuentas-garmin">Mis cuentas Garmin</a>
      {% endif %}
      {% if user.is_admin %}
      <a href="/admin/usuarios">Usuarios</a>
      <a href="/admin/invitaciones">Invitaciones</a>
      {% endif %}
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link">Cerrar sesión</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
