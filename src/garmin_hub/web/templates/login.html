{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<form method="post" action="/login" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Correo
    <input type="email" name="email" required autocomplete="username" value="{{ email or '' }}">
  </label>
  <label>Contraseña
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit">Entrar</button>
</form>
<p><a href="/alta">Tengo un código de invitación</a> ·
   <a href="/restablecer">Tengo un código de restablecimiento</a></p>
{% endblock %}
